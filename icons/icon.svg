<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d13" />
      <stop offset="50%" stop-color="#131722" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3" />

  <!-- Orbit Ring -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#glowGrad)" stroke-width="14" stroke-dasharray="24 16" filter="url(#shadow)" opacity="0.85" />

  <!-- Core Shield / Hexagon -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Central Life Beacon -->
    <circle cx="0" cy="0" r="88" fill="url(#glowGrad)" />
    
    <!-- Vault Keyhole / Tree of Life Icon -->
    <path d="M 0 -44 A 26 26 0 0 1 18 -5 L 14 36 A 14 14 0 0 1 -14 36 L -18 -5 A 26 26 0 0 1 0 -44 Z" fill="#0b0d13" />
    <circle cx="0" cy="-22" r="10" fill="url(#glowGrad)" />

    <!-- 4 Orbiting Satellite Spheres (Finances, Health, Milestones, Maintenance) -->
    <circle cx="-148" cy="0" r="18" fill="#10b981" />
    <circle cx="148" cy="0" r="18" fill="#06b6d4" />
    <circle cx="0" cy="-148" r="18" fill="#a855f7" />
    <circle cx="0" cy="148" r="18" fill="#f59e0b" />
  </g>
</svg>
